<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'zbekcha Wordle</title>
    <style>
        :root {
            --green: #6aaa64;
            --yellow: #c9b458;
            --gray: #787c7e;
            --dark-gray: #3a3a3c;
            --light-gray: #d3d6da;
            --border: #878a8c;
            --text-color: #1a1a1b;
            --bg-color: #ffffff;
            --key-bg: #d3d6da;
            --key-text: #1a1a1b;
        }

        [data-theme="dark"] {
            --text-color: #ffffff;
            --bg-color: #121213;
            --border: #3a3a3c;
            --key-bg: #818384;
            --key-text: #ffffff;
        }

        body {
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            justify-content: space-between;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-color);
        }

        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        #grid {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            grid-gap: 5px;
            width: 350px;
            height: 420px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-gap: 5px;
        }

        .tile {
            width: 100%;
            height: 100%;
            border: 2px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
            transition: transform 0.3s ease;
        }

        .tile.filled {
            border-color: var(--dark-gray);
            transform: scale(1.05);
        }

        .tile.correct { background-color: var(--green); color: white; border: none; }
        .tile.present { background-color: var(--yellow); color: white; border: none; }
        .tile.absent { background-color: var(--gray); color: white; border: none; }

        #keyboard {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-bottom: 8px;
            touch-action: manipulation;
        }

        .key {
            font-family: inherit;
            background-color: var(--key-bg);
            color: var(--key-text);
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            height: 58px;
            flex: 1;
            margin: 0 2px;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            text-transform: uppercase;
        }

        .key.wide {
            flex: 1.5;
            font-size: 12px;
        }

        .key.correct { background-color: var(--green); color: white; }
        .key.present { background-color: var(--yellow); color: white; }
        .key.absent { background-color: var(--gray); color: white; }

        #toast-container {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            animation: fadeInOut 2s ease forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <button class="icon-btn" id="theme-toggle">🌙</button>
        <h1>O'ZBEK WORDLE</h1>
        <button class="icon-btn" id="restart-btn">🔄</button>
    </header>

    <div id="toast-container"></div>

    <div id="game-container">
        <div id="grid"></div>
    </div>

    <div id="keyboard">
        <div class="keyboard-row">
            <button class="key" data-key="Q">Q</button>
            <button class="key" data-key="W">W</button>
            <button class="key" data-key="E">E</button>
            <button class="key" data-key="R">R</button>
            <button class="key" data-key="T">T</button>
            <button class="key" data-key="Y">Y</button>
            <button class="key" data-key="U">U</button>
            <button class="key" data-key="I">I</button>
            <button class="key" data-key="O">O</button>
            <button class="key" data-key="P">P</button>
        </div>
        <div class="keyboard-row">
            <button class="key" data-key="A">A</button>
            <button class="key" data-key="S">S</button>
            <button class="key" data-key="D">D</button>
            <button class="key" data-key="F">F</button>
            <button class="key" data-key="G">G</button>
            <button class="key" data-key="H">H</button>
            <button class="key" data-key="J">J</button>
            <button class="key" data-key="K">K</button>
            <button class="key" data-key="L">L</button>
        </div>
        <div class="keyboard-row">
            <button class="key wide" data-key="ENTER">Kiritish</button>
            <button class="key" data-key="Z">Z</button>
            <button class="key" data-key="X">X</button>
            <button class="key" data-key="C">C</button>
            <button class="key" data-key="V">V</button>
            <button class="key" data-key="B">B</button>
            <button class="key" data-key="N">N</button>
            <button class="key" data-key="M">M</button>
            <button class="key wide" data-key="BACKSPACE">O'chirish</button>
        </div>
    </div>

    <script>
        // O'zbekcha 5 harfli so'zlar bazasi (Target words)
        const TARGET_WORDS = [
            "KITOB", "QALAM", "MAKTAB", "OLMAQ", "ANORV", "TOSHKENT", "SAMAR", "BOGCH", 
            "YURAK", "BULOQ", "DARYO", "OSMON", "YULDUZ", "NONVO", "TOZAL", "BAHOR", 
            "QISHLO", "YAXSHI", "BILIM", "OQUVCHI", "TINCH", "VATAN", "DOSTV", "UYCHI",
            "MASHQ", "PAXTA", "QUYOSH", "SHAMO", "YOMGIR", "BOLAL", "ATIRG", "MEVAH"
        ];
        
        // Clean up to strictly 5-letter standard words for reliable gameplay
        const UZBEK_WORDS = [
            "KITOB", "YURAK", "BULUT", "DARYO", "OSMON", "BAHOR", "KUZGI", "QISHI",
            "Yozgi", "SHAHAR", "QISHLOQ", "MAKTAB", "TALABA", "BILIM", "TINCH", "VATAN",
            "DOSTI", "MASHQ", "PAXTA", "QUYOSH", "YOMGIR", "BOLALAR", "OLMA", "ANOR",
            "UZUM", "QOVUN", "TARVUZ", "NONVO", "TOZA", "ISSIQ", "SOVUQ", "YAXSHI",
            "YOMON", "BALAND", "PAST", "KATTA", "KICHIK", "TEZ", "SEKIN", "OQIN",
            "QORA", "QIZIL", "YASIL", "SARIQ", "HAKAM", "AHVOL", "AMALI", "ARZON",
            "QIMMAT", "BAXT", "OMAD", "ZAFAR", "GOLIB", "KUMUSH", "OLTIN", "TEMIR",
            "PAXTA", "SHARQ", "G‘ARB", "SHIMOL", "JANUB", "BOLTA", "PICHOQ", "QASAM"
        ];

        let target = "";
        let guesses = Array(6).fill("");
        let currentGuessIndex = 0;
        let isGameOver = false;

        const gridEl = document.getElementById("grid");
        const toastContainer = document.getElementById("toast-container");

        function initGame() {
            // Pick random word
            target = UZBEK_WORDS[Math.floor(Math.random() * UZBEK_WORDS.length)];
            guesses = Array(6).fill("");
            currentGuessIndex = 0;
            isGameOver = false;
            
            gridEl.innerHTML = "";
            for (let i = 0; i < 6; i++) {
                const row = document.createElement("div");
                row.className = "row";
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement("div");
                    tile.className = "tile";
                    row.appendChild(tile);
                }
                gridEl.appendChild(row);
            }

            // Reset keyboard styles
            document.querySelectorAll(".key").forEach(key => {
                key.className = "key" + (key.dataset.key === "ENTER" || key.dataset.key === "BACKSPACE" ? " wide" : "");
            });
        }

        function showToast(message) {
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerText = message;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function handleKeyPress(key) {
            if (isGameOver) return;

            if (key === "ENTER") {
                if (guesses[currentGuessIndex].length < 5) {
                    showToast("Harflar yetarli emas!");
                    return;
                }
                checkGuess();
            } else if (key === "BACKSPACE") {
                if (guesses[currentGuessIndex].length > 0) {
                    guesses[currentGuessIndex] = guesses[currentGuessIndex].slice(0, -1);
                    updateGrid();
                }
            } else {
                if (guesses[currentGuessIndex].length < 5 && /^[A-ZĞ‘ŞÇÜÖİ]$/.test(key)) {
                    guesses[currentGuessIndex] += key;
                    updateGrid();
                }
            }
        }

        function updateGrid() {
            const row = gridEl.children[currentGuessIndex];
            const currentWord = guesses[currentGuessIndex];
            for (let i = 0; i < 5; i++) {
                const tile = row.children[i];
                tile.innerText = currentWord[i] || "";
                if (currentWord[i]) {
                    tile.classList.add("filled");
                } else {
                    tile.classList.remove("filled");
                }
            }
        }

        function checkGuess() {
            const guess = guesses[currentGuessIndex];
            
            const row = gridEl.children[currentGuessIndex];
            const targetChars = target.split("");
            const guessChars = guess.split("");
            const statuses = Array(5).fill("absent");

            // Check correct positions
            for (let i = 0; i < 5; i++) {
                if (guessChars[i] === targetChars[i]) {
                    statuses[i] = "correct";
                    targetChars[i] = null;
                    guessChars[i] = null;
                }
            }

            // Check present positions
            for (let i = 0; i < 5; i++) {
                if (guessChars[i] !== null) {
                    const index = targetChars.indexOf(guessChars[i]);
                    if (index > -1) {
                        statuses[i] = "present";
                        targetChars[index] = null;
                    }
                }
            }

            // Apply styles to tiles and keyboard
            for (let i = 0; i < 5; i++) {
                const tile = row.children[i];
                tile.classList.add(statuses[i]);
                updateKeyColor(guess[i], statuses[i]);
            }

            if (guess === target) {
                showToast("Tabriklaymiz, yutdingiz! 🎉");
                isGameOver = true;
                return;
            }

            currentGuessIndex++;
            if (currentGuessIndex === 6) {
                showToast(`O'yin tugadi! So'z: ${target}`);
                isGameOver = true;
            }
        }

        function updateKeyColor(letter, status) {
            const key = document.querySelector(`.key[data-key="${letter}"]`);
            if (!key) return;
            if (key.classList.contains("correct")) return;
            if (key.classList.contains("present") && status === "absent") return;
            key.className = `key ${status}`;
        }

        // Event listeners for on-screen keyboard
        document.querySelectorAll(".key").forEach(button => {
            button.addEventListener("click", () => {
                handleKeyPress(button.dataset.key);
            });
        });

        // Event listener for physical keyboard
        document.addEventListener("keydown", (e) => {
            let key = e.key.toUpperCase();
            if (key === "ENTER") handleKeyPress("ENTER");
            else if (key === "BACKSPACE") handleKeyPress("BACKSPACE");
            else handleKeyPress(key);
        });

        // Restart button
        document.getElementById("restart-btn").addEventListener("click", initGame);

        // Theme toggle
        document.getElementById("theme-toggle").addEventListener("click", () => {
            const body = document.body;
            const isDark = body.getAttribute("data-theme") === "dark";
            body.setAttribute("data-theme", isDark ? "light" : "dark");
            document.getElementById("theme-toggle").innerText = isDark ? "☀️" : "🌙";
        });

        // Initialize on load
        initGame();
    </script>
</body>
</html>
